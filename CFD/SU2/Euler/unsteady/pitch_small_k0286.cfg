%% ---------------------------------------------------------------------------
%% STEP 2a: prescribed pitch 2 deg  (attached benchmark vs Peters)
%% Derived from SU2_naca0020.cfg (steady, banked). Overridden keys only; all
%% numerics, mesh and markers inherited. Reduced frequency matched to the rig:
%%   k = omega*b/U = 0.286  (rig: 2*pi*5.7 Hz, b = 0.1 m, U = 12.5 m/s)
%%   here: c = 1 m, M = 0.3 -> U = 102.08 m/s -> PITCHING_OMEGA = 58.42 rad/s
%%   period T = 0.10755 s, 128 steps/period -> TIME_STEP = 8.4023e-4 s
%% Pitch axis (0.25, 0, 0): his moment reference = rig elastic axis (a = -0.5).
%% ---------------------------------------------------------------------------
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case: NACA 0020, steady inviscid (Euler), subsonic workflow + mesh study     %
% Author: Peemanus Ritthidetch  |  University of Bristol                       %
% Notes: This is a COMPLETE, RUNNABLE config. Every section SU2 touches for a   %
%        steady Euler airfoil run is here and set explicitly (no hidden        %
%        defaults). Unlike config_template.cfg, it contains no placeholder or   %
%        duplicate options, so it parses and runs.                             %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% --------------------------- PROBLEM DEFINITION ------------------------------%
%
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% --------------------------- SOLVER CONTROL ----------------------------------%
%
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -7
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-10

% ----------------------- TIME-DEPENDENT SIMULATION ---------------------------%
% Steady run -> time off. (For the LCO case later, this section switches on.)
%
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
GRID_MOVEMENT= RIGID_MOTION
SURFACE_MOVEMENT= NONE

% ---------------------- COMPRESSIBLE FREESTREAM ------------------------------%
%
MACH_NUMBER= 0.3
AOA= 10.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
REF_DIMENSIONALIZATION= DIMENSIONAL

% --------------------------- FLUID MODEL -------------------------------------%
%
FLUID_MODEL= STANDARD_AIR
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058

% ------------------------- REFERENCE VALUES ----------------------------------%
% Used to normalise CL/CD/CM. Unit chord, unit area (2D).
%
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ----------------------- BOUNDARY CONDITIONS ---------------------------------%
% Must match the MARKER_TAG names inside the .su2 mesh exactly.
%
MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )

% ----------------------- SURFACE IDENTIFICATION ------------------------------%
%
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% --------------------- COMMON NUMERICAL METHOD -------------------------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 2.0, 5.0, 1e4 )

% ---------------------- FLOW NUMERICAL METHOD --------------------------------%
%
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )
MUSCL_FLOW= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT

% ------------------------- LINEAR SOLVER -------------------------------------%
% Solves the implicit system each iteration.
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10

% ------------------------- MULTIGRID -----------------------------------------%
%
MGLEVEL= 0

% ------------------------- INPUT / OUTPUT ------------------------------------%
%
MESH_FILENAME= naca0020_medium.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
SCREEN_OUTPUT= ( TIME_ITER, INNER_ITER, RMS_DENSITY, LIFT, MOMENT_Z )
HISTORY_OUTPUT= ( TIME_ITER, CUR_TIME, RMS_RES, AERO_COEFF )
OUTPUT_FILES= ( RESTART )
OUTPUT_WRT_FREQ= 768
CONV_FILENAME= history_small
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SANITY CHECK after it runs:
%   CL ~ 0.23-0.25, CD ~ 0  (inviscid -> d'Alembert). This is your Stage-1
%   thin-airfoil theory validating the CFD.
% MESH STUDY: change MESH_FILENAME to naca0020_coarse / _fine, compare CL & CD.
% REAL MICHIGAN CASE (M~0.04): the compressible solver is stiff there; switch
%   to SOLVER= INC_EULER (incompressible) -- we'll set that up separately.
% IF IT STALLS/DIVERGES: lower CFL_NUMBER to 2.0 first.
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
TIME_STEP= 8.4023e-4
TIME_ITER= 768
INNER_ITER= 80
SOLUTION_FILENAME= restart_steady10.dat
MOTION_ORIGIN= 0.25 0.0 0.0
PITCHING_OMEGA= 0.0 0.0 58.42
PITCHING_PHASE= 0.0 0.0 0.0
HISTORY_WRT_FREQ_INNER= 0
PITCHING_AMPL= 0.0 0.0 2.0
RESTART_FILENAME= restart_small.dat